<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenWake</title>
<meta name="description" content="OpenWake">
<meta name="theme-color" content="#16a34a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OpenWake">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#f3f4f6;background:#070f1a;background-image:radial-gradient(560px 420px at 50% 0%,rgba(34,197,94,.30),transparent 62%);background-attachment:fixed;min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:36px 0 38px}
header img{width:48px;height:48px;border-radius:13px;box-shadow:0 6px 18px rgba(21,128,61,.35)}
header h1{font-size:32px;margin:0;letter-spacing:.02em}
.ring-wrap{text-align:center;padding:18px 0 6px}
.ring{width:168px;height:168px;border-radius:50%;margin:0 auto;display:grid;place-items:center;border:3px solid rgba(34,197,94,.9);font-size:54px;cursor:pointer;background:rgba(34,197,94,.08);-webkit-tap-highlight-color:transparent}
.ring:active{transform:scale(.97)}
.ring.on{background:rgba(34,197,94,.08);box-shadow:0 0 34px rgba(34,197,94,.45),inset 0 0 24px rgba(34,197,94,.25);animation:breathe 2.4s ease-in-out infinite}
.ring.off{border-color:rgba(239,68,68,.85);background:rgba(239,68,68,.08);box-shadow:0 0 22px rgba(239,68,68,.30)}
@keyframes breathe{0%,100%{box-shadow:0 0 26px rgba(34,197,94,.35),inset 0 0 20px rgba(34,197,94,.20)}50%{box-shadow:0 0 48px rgba(34,197,94,.65),inset 0 0 30px rgba(34,197,94,.35)}}
.ring svg{display:block;margin:0 auto}
.ring .sub{display:block;font-size:15px;letter-spacing:.1em;margin-top:2px}
.ring-state{text-align:center;font-size:14px;font-weight:600;letter-spacing:.18em;margin-top:12px}
.ring-state.is-on{color:#22c55e}
.ring-state.is-off{color:#94a3b8}
.divider{height:1px;background:rgba(255,255,255,.12);margin:26px 4px 18px}
.empty{color:#94a3b8;text-align:center;padding:40px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.overlay.show{display:flex}
.modal{width:100%;max-width:340px;padding:26px 22px;text-align:center;border-radius:24px;background:#111827;color:#f3f4f6;border:1px solid rgba(34,197,94,.4)}
.modal .small{color:#94a3b8;font-size:14px;margin:0}
.modal h2{font-size:30px;margin:10px 0 22px}
.modal .row{display:flex;gap:12px}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:16px;font-size:17px;font-weight:600;cursor:pointer;margin-top:0;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.cancel{background:rgba(255,255,255,.12);color:#f3f4f6}
.confirm-green{background:#16a34a;color:#fff}
.confirm-red{background:#ef4444;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:12px 20px;border-radius:999px;display:none;z-index:30;font-size:15px;max-width:92vw;text-align:center}
@media(min-width:700px){.wrap{max-width:560px}}
</style></head><body><div class="wrap">
<header><img src="/icon-192.png" alt="OpenWake"><h1>OpenWake</h1></header>
<div id="rings"></div>
<div class="divider"></div>
<div class="ring-wrap"><div class="ring on" onclick="ask('openwrt')"><span><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="12"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg><span class="sub">OP</span></span></div><div class="ring-state is-on">NOW: ON</div></div>
</div>
<div id="overlay" class="overlay"><div class="modal"><p class="small">请确认</p><h2 id="actTitle">关机</h2><div class="row"><button class="btn cancel" onclick="closeModal()">取消</button><button id="confirmBtn" class="btn confirm-red" onclick="doAct()">确认</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
let pending=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000)}
async function api(p,m){const r=await fetch(p,{method:m||'GET'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function load(){
  try{const s=await api('/api/public/status');
    const pcs=s.pcs||[];
    document.getElementById('rings').innerHTML=pcs.length?pcs.map(p=>{
      const label=pcs.length===1?'PC':(p.name||p.id);
      const act=p.online?'shutdown':'wake';
      return `<div class="ring-wrap"><div class="ring ${p.online?'on':'off'}" onclick="ask('pc','${p.id}','${act}')"><span><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="12"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg><span class="sub">${label}</span></span></div><div class="ring-state ${p.online?'is-on':'is-off'}">NOW: ${p.online?'ON':'OFF'}</div></div>`;
    }).join(''):'<div class="empty">暂无 PC</div>';
  }catch(e){toast(e.message)}
}
const actText={wake:'开机',shutdown:'关机',openwrt:'OP关机'};
function ask(kind,id,act){
  if(kind==='openwrt'){pending={url:'/api/public/openwrt/poweroff',red:true};document.getElementById('actTitle').textContent='OP关机'}
  else{pending={url:'/api/public/pc/'+id+'/'+act,red:(act!=='wake')};document.getElementById('actTitle').textContent=actText[act]}
  document.getElementById('confirmBtn').className='btn '+(pending.red?'confirm-red':'confirm-green');
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){pending=null;document.getElementById('overlay').classList.remove('show')}
async function doAct(){
  if(!pending)return;const u=pending.url;closeModal();
  try{const r=await api(u,'POST');toast(r.message);setTimeout(load,3000)}catch(e){toast(e.message)}
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
load();setInterval(load,15000);
</script></body></html>
